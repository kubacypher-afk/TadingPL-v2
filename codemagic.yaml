workflows:
  simulator-quick:
    name: 🚀 Szybki Build Symulator (Appetize.io - ~45s)
    max_build_duration: 15
    instance_type: mac_mini_m1
    environment:
      vars:
        XCODE_PROJECT: "APP.xcodeproj"
        XCODE_SCHEME: "APP"
      xcode: latest
    scripts:
      - name: Fast Simulator Compile & Package
        script: |
          set -e
          ROOT_DIR=$(pwd)
          SIM_DIR="$ROOT_DIR/build/simulator_export"
          mkdir -p "$SIM_DIR"
          
          echo "Błyskawiczna kompilacja pod symulator (wyłączone zbędne indeksowanie i dSYM)..."
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim_derived \
            build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
            
          cd build/sim_derived/Build/Products/Debug-iphonesimulator
          zip -r -y -1 "$SIM_DIR/TradingDesk-Simulator.zip" APP.app
          cd "$ROOT_DIR"
          
          echo "Gotowe w kilkadziesiąt sekund! Plik:"
          ls -lh "$SIM_DIR/TradingDesk-Simulator.zip"
    artifacts:
      - build/simulator_export/*.zip

  ipa-release:
    name: 📱 Pełny Build IPA (Prawdziwy iPhone)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "APP.xcodeproj"
        XCODE_SCHEME: "APP"
      xcode: latest
    scripts:
      - name: Build Device IPA
        script: |
          set -e
          ROOT_DIR=$(pwd)
          IPA_DIR="$ROOT_DIR/build/ios/ipa"
          ARCHIVE_PATH="$ROOT_DIR/build/ios/xcarchive/APP.xcarchive"
          mkdir -p "$IPA_DIR"
          
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          APP_PATH="$ARCHIVE_PATH/Products/Applications/APP.app"
          TMP_PAYLOAD_DIR="$ROOT_DIR/build/ios/tmp_payload"
          mkdir -p "$TMP_PAYLOAD_DIR/Payload"
          cp -R "$APP_PATH" "$TMP_PAYLOAD_DIR/Payload/"
          
          cd "$TMP_PAYLOAD_DIR"
          zip -r -y -1 "$IPA_DIR/TradingDesk.ipa" Payload
          
          cd "$ROOT_DIR"
          rm -rf "$TMP_PAYLOAD_DIR"
          ls -lh "$IPA_DIR/TradingDesk.ipa"
    artifacts:
      - build/ios/ipa/*.ipa
