workflows:
  ios-workflow:
    name: iOS Build IPA & Simulator (Trading Desk)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "APP.xcodeproj"
        XCODE_SCHEME: "APP"
        BUNDLE_ID: "com.tradingpl.app"
      xcode: latest
    scripts:
      - name: Show Xcode and SDK information
        script: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path
      - name: Build Simulator Package for Appetize.io
        script: |
          set -e
          ROOT_DIR=$(pwd)
          SIM_DIR="$ROOT_DIR/build/simulator_export"
          mkdir -p "$SIM_DIR"
          
          echo "Compiling for iOS Simulator (Appetize.io)..."
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim_derived \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
            
          cd build/sim_derived/Build/Products/Release-iphonesimulator
          zip -r -y "$SIM_DIR/TradingDesk-Simulator.zip" APP.app
          cd "$ROOT_DIR"
          
          echo "Simulator build finished! Created:"
          ls -la "$SIM_DIR"
      - name: Build Device Archive & Generate IPA
        script: |
          set -e
          ROOT_DIR=$(pwd)
          IPA_DIR="$ROOT_DIR/build/ios/ipa"
          ARCHIVE_PATH="$ROOT_DIR/build/ios/xcarchive/APP.xcarchive"
          mkdir -p "$IPA_DIR"
          
          echo "Compiling Xcode project for physical iOS Device..."
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          echo "Packaging .app into .ipa payload..."
          APP_PATH="$ARCHIVE_PATH/Products/Applications/APP.app"
          TMP_PAYLOAD_DIR="$ROOT_DIR/build/ios/tmp_payload"
          mkdir -p "$TMP_PAYLOAD_DIR/Payload"
          cp -R "$APP_PATH" "$TMP_PAYLOAD_DIR/Payload/"
          
          cd "$TMP_PAYLOAD_DIR"
          zip -r -y "$IPA_DIR/TradingDesk.ipa" Payload
          
          cd "$ROOT_DIR"
          rm -rf "$TMP_PAYLOAD_DIR"
          
          echo "Device IPA finished! Created:"
          ls -la "$IPA_DIR"
    artifacts:
      - build/simulator_export/*.zip
      - build/ios/ipa/*.ipa
