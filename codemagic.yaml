workflows:
  ios-workflow:
    name: iOS Build IPA (Trading Desk)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "APP.xcodeproj"
        XCODE_SCHEME: "APP"
        BUNDLE_ID: "com.tradingpl.app"
      xcode: latest
    scripts:
      - name: Show Xcode and SDK information
        script: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
      - name: Build Archive & Generate IPA
        script: |
          set -e
          
          # Clean build folders
          rm -rf build
          mkdir -p build/ios/ipa
          mkdir -p build/ios/xcarchive
          
          echo "Compiling Xcode project for iOS Device..."
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/xcarchive/APP.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          echo "Packaging .app into .ipa payload..."
          cd build/ios/xcarchive/APP.xcarchive/Products/Applications
          mkdir -p Payload
          cp -R APP.app Payload/
          zip -r -y ../../../../ipa/TradingDesk.ipa Payload
          cd ../../../..
          
          echo "Build finished! Generated IPA:"
          ls -la build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
