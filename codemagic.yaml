workflows:
  ios-workflow:
    name: iOS Build IPA (Trading Desk)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "APP.xcodeproj"
        XCODE_SCHEME: "APP"
        BUNDLE_ID: "com.tradingpl.app"
      xcode: latest
    scripts:
      - name: Show Xcode and SDK information
        script: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
      - name: Build Archive & Generate IPA
        script: |
          set -e
          
          ROOT_DIR=$(pwd)
          IPA_DIR="$ROOT_DIR/build/ios/ipa"
          ARCHIVE_PATH="$ROOT_DIR/build/ios/xcarchive/APP.xcarchive"
          
          # Clean build folders
          rm -rf build
          mkdir -p "$IPA_DIR"
          
          echo "Compiling Xcode project for iOS Device..."
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          echo "Packaging .app into .ipa payload..."
          APP_PATH="$ARCHIVE_PATH/Products/Applications/APP.app"
          TMP_PAYLOAD_DIR="$ROOT_DIR/build/ios/tmp_payload"
          mkdir -p "$TMP_PAYLOAD_DIR/Payload"
          cp -R "$APP_PATH" "$TMP_PAYLOAD_DIR/Payload/"
          
          cd "$TMP_PAYLOAD_DIR"
          zip -r -y "$IPA_DIR/TradingDesk.ipa" Payload
          
          cd "$ROOT_DIR"
          rm -rf "$TMP_PAYLOAD_DIR"
          
          echo "Build finished! Generated IPA successfully:"
          ls -la "$IPA_DIR"
    artifacts:
      - build/ios/ipa/*.ipa
